# Configuracion del stack local de Supabase.
#
# ESCRITO PARA EL CLI DE SUPABASE >= 2.115.0. El esquema de este archivo cambia
# entre versiones del CLI: uno viejo rechaza claves nuevas y uno nuevo renombra
# claves viejas. `pnpm supabase:check` verifica la version antes de arrancar el
# stack y falla con un mensaje accionable (blueprint.md §10, paso 3).
#
# Solo se declaran claves estables de la linea 2.x. Todo lo demas queda en los
# valores por omision del CLI a proposito: cada clave declarada es una clave que
# puede romperse en una actualizacion.
project_id = "super-store-sales-os"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
# `localhost` y `127.0.0.1` son origenes DISTINTOS para esta lista: un enlace de
# invitacion que vuelva a `localhost:3000` con solo `127.0.0.1` declarado se
# ignora y cae de vuelta a la site_url. Se declaran los dos, y tambien el
# :3101 que usa Playwright.
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/confirm",
  "http://localhost:3000/auth/confirm",
  "http://127.0.0.1:3101",
  "http://localhost:3101",
]
jwt_expiry = 3600
# Solo por invitacion: no existe registro publico en este producto.
# Las cuentas las crea un admin desde Configuracion (blueprint.md §8).
enable_signup = false

[auth.email]
enable_confirmations = false

# Plantilla propia del correo de invitacion.
#
# La de fabrica usa `{{ .ConfirmationURL }}`, que devuelve el token en el
# FRAGMENTO de la URL (`#access_token=...`). El fragmento no viaja al servidor,
# asi que esta app —que solo tiene clientes de servidor— no podia leerlo nunca:
# la invitacion llegaba, se aceptaba, y no pasaba nada. Con `{{ .TokenHash }}`
# el hash va en el query string, que si llega, y `/auth/confirm` lo canjea.
#
# OJO: esto vale en LOCAL. El proyecto hosted no permite editar plantillas sin
# SMTP propio, asi que alli sigue enviando la de fabrica. La app atiende las dos
# formas —`/auth/confirm` lee el fragmento y el query string— asi que activar
# SMTP mas adelante no obliga a cambiar codigo. Lo unico obligatorio en el panel
# es tener la URL de retorno en Authentication > URL Configuration.
[auth.email.template.invite]
subject = "Te invitaron a Super Store Sales OS"
content_path = "./supabase/templates/invite.html"

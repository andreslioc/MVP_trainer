name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      # Todo el suite comparte el Postgres del stack local de Supabase. Las
      # pruebas de Auth, RLS y Storage necesitan sus servicios y esquemas; un
      # contenedor de Postgres puro no puede ejecutarlas correctamente.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      AI_MODEL_DEFAULT: claude-opus-5
      AI_MODEL_SMALL: claude-haiku-4-5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v2
        with:
          version: 2.115.0

      # El lockfile manda: un install que resuelva versiones distintas a las
      # fijadas invalida todo lo que venga despues.
      - run: pnpm install --frozen-lockfile

      # Las pruebas de compresion de audio invocan ffmpeg de verdad: sin el
      # binario fallan con ENOENT y el fallo no dice nada del codigo.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm supabase:start

      # Extrae las llaves publicable y secreta del stack efimero. Son llaves
      # locales generadas por Supabase CLI, nunca secretos de produccion.
      - run: pnpm env:local:supabase

      - run: pnpm db:migrate:test

      # La semilla corre en CI porque hay una prueba que verifica que sea
      # idempotente: sin este paso cuenta cero filas y falla por vacia, no por
      # rota.
      - run: pnpm db:seed

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # El build va al final a proposito: construir codigo que no pasa sus
      # propias puertas solo produce un artefacto roto mas rapido.
      - run: pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: super_store_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las pruebas solo tocan la base del servicio de arriba. Ningun secreto de
      # produccion entra a CI: la capa de IA se inyecta falsa en las pruebas.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/super_store_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/super_store_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/super_store_test
      AI_MODEL_DEFAULT: claude-opus-5
      AI_MODEL_SMALL: claude-haiku-4-5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # El lockfile manda: un install que resuelva versiones distintas a las
      # fijadas invalida todo lo que venga despues.
      - run: pnpm install --frozen-lockfile

      # Las pruebas de compresion de audio invocan ffmpeg de verdad: sin el
      # binario fallan con ENOENT y el fallo no dice nada del codigo.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm db:migrate:test

      # La semilla corre en CI porque hay una prueba que verifica que sea
      # idempotente: sin este paso cuenta cero filas y falla por vacia, no por
      # rota.
      - run: pnpm db:seed

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # El build va al final a proposito: construir codigo que no pasa sus
      # propias puertas solo produce un artefacto roto mas rapido.
      - run: pnpm build
